[workspace]
resolver = "2"
members = [
    "crates/rmv-core",
    "crates/rmv-cli",
    "crates/rmv-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RootMyVivo-RS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zenyxx-xd/RootMyVivo"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
regex = "1.11"
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = { version = "0.17", features = ["tokio"] }
colored = "3.0"
anyhow = "1.0"
rust-i18n = "3"
sys-locale = "0.3"
webadb-rs = { git = "https://github.com/IsMyPhonePwned/webadb-rs", default-features = false }
nusb = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
spake2 = "0.4"
aes-gcm = "0.10"
hkdf = "0.12"
mdns-sd = "0.11"
