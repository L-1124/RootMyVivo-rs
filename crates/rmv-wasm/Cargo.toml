[package]
name = "rmv-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rmv-core = { path = "../rmv-core", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
webadb-rs = { git = "https://github.com/IsMyPhonePwned/webadb-rs", default-features = false, features = ["webusb"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Navigator",
    "Storage",
    "Usb",
    "UsbDevice",
    "UsbConfiguration",
    "UsbInterface",
    "UsbAlternateInterface",
    "UsbEndpoint",
    "UsbInTransferResult",
    "UsbOutTransferResult",
    "UsbControlTransferParameters",
    "UsbDirection",
    "UsbRequestType",
    "UsbRecipient",
    "UsbTransferStatus",
    "UsbDeviceFilter",
    "UsbDeviceRequestOptions",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webadb-rs = { git = "https://github.com/IsMyPhonePwned/webadb-rs", default-features = false }
